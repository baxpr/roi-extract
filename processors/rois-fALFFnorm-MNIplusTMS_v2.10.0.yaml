---
procyamlversion: 3.0.0-dev.0

description: Normalized fALFF ROI extraction for hippocampus, https://github.com/baxpr/roi-extract

containers:
  - name: fmriprep
    path: fmriprep_24.1.1.sif
    source: docker://nipreps/fmriprep:24.1.1
  - name: fsl
    path: fsl-base_v6.0.7.18.sif
    source: docker://baxterprogers/fsl-base:v6.0.7.18

requirements:
  walltime: '0-12'
  memory: '8000'

jobtemplate: job_template_v3.txt

inputs:
  xnat:
      
    filters:
      - type: match
        inputs: scan_fmri,assr_fmriprep/scan_fmri
      - type: match
        inputs: scan_fmri,assr_alff/scan_fmri
      - type: match
        inputs: scan_t1,assr_freesurfer/scan_t1
        
    scans:

      - name: scan_t1
        types: t1
        skip_unusable: True

      - name: scan_fmri
        types: rsfMRI
        skip_unusable: True

    assessors:
        
        - name: assr_alff
          proctypes: afni-alff-kgm_v1
          resources:
            - {resource: FALFF_NORM, ftype: FILE, fdest: fALFFnorm.nii.gz}

        - name: assr_fmriprep
          proctypes: fmriprep-nofs_v24
          resources:
            - {resource: fmriprepBIDS, ftype: DIR, fdest: fmriprep}

        - name: assr_freesurfer
          proctypes: freesurfer810_v2
          resources:
            - {resource: SUBJECT, ftype: DIR, fdest: freesurfer}

    attrs:
      - {varname: project, object: assessor, attr: project}
      - {varname: subject, object: session, attr: subject_label}
      - {varname: session, object: session, attr: label}
      - {varname: scan, object: scan, attr: ID, ref: scan_fmri}
     
outputs:
  - {path: fALFFnorm-extract.pdf, type: FILE, resource: PDF}
  - {path: roisMNIplusTMS.nii.gz, type: FILE, resource: ROIS}
  - {path: roisMNIplusTMS-labels.csv, type: FILE, resource: ROIS}
  - {path: rois-values.csv, type: FILE, resource: STATS}
  - {path: roi-extract/src, type: DIR, resource: SCRIPTS}


command: 
  type: singularity_exec
  container: fmriprep
  extraopts: --bind /data/mcr/rocky9/FS/license.txt:/opt/freesurfer/license.txt
  args: >-
    bash -c '
    cd /OUTPUTS &&
    curl -o roi-extract.tar.gz -L https://github.com/baxpr/roi-extract/archive/refs/tags/v2.10.0.tar.gz &&
    tar -zxf roi-extract.tar.gz &&
    mv roi-extract-* roi-extract &&
    export PATH=/OUTPUTS/roi-extract/src:\$PATH &&
    xwrapper.sh hipp-pfc-plusTMS.sh
      --fs_subj_dir /INPUTS/freesurfer/SUBJECT
      --fmriprep_dir /INPUTS/fmriprep/fmriprepBIDS
      --img_niigz /INPUTS/fALFFnorm.nii.gz
      --img_label fALFFnorm
      --out_dir /OUTPUTS
    '

post:
  type: singularity_exec
  container: fsl
  args: >-
    bash -c '
    export PATH=/OUTPUTS/roi-extract/src:\$PATH &&
    xwrapper.sh hipp-pfc-plusTMS-pdf.sh
    --fmriprep_dir /INPUTS/fmriprep/fmriprepBIDS
    --img_niigz /INPUTS/fALFFnorm.nii.gz
    --img_label fALFFnorm
    --out_dir /OUTPUTS
    --label_info "{project} {subject} {session} {scan}"
    '
